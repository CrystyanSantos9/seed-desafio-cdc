openapi: 3.0.3
info:
  title: API Specification for category operations
  description: |-
    A simple category API that allows the operations below:
    - create a new category
  version: 1.0.0
servers:
  - description: Localhost
    url: https://localhost:8887/api/v1
tags:
  - name: Categories
    description: Manages information of categories
paths:
  /books:
    post:
      tags:
        - Books
      summary: Creates
      description: create
      operationId: createNewBook
      requestBody:
        description: create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBook'
      responses:
        200:
          $ref: '#/components/responses/BookCreated'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        413:
          $ref: '#/components/responses/ContentTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'
        502:
          $ref: '#/components/responses/BadGatewayError'
        503:
          $ref: '#/components/responses/ServiceUnavailableError'
        504:
          $ref: '#/components/responses/GatewayTimeoutError'
    get:
      tags:
        - Books
      summary: List all books.
      description: Returns a list of avaiable books.
      operationId: listAllBooks
      responses:
        200:
          $ref: '#/components/responses/ListAvaiableBooks'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        413:
          $ref: '#/components/responses/ContentTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'
        502:
          $ref: '#/components/responses/BadGatewayError'
        503:
          $ref: '#/components/responses/ServiceUnavailableError'
        504:
          $ref: '#/components/responses/GatewayTimeoutError'
  /categories:
    post:
      tags:
        - Categories
      summary: Creates a new category
      description: Creates a new category
      operationId: create
      requestBody:
        description: New category informations
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
        required: true
      responses:
        200:
          $ref: '#/components/responses/CategoryCreated'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        413:
          $ref: '#/components/responses/ContentTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'
        502:
          $ref: '#/components/responses/BadGatewayError'
        503:
          $ref: '#/components/responses/ServiceUnavailableError'
        504:
          $ref: '#/components/responses/GatewayTimeoutError'
  /authors:
    post:
      tags:
        - Authors
      summary: Creates a new author
      description: Creates a new author
      operationId: createNewAuthor
      requestBody:
        description: New author informations
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAuthor'
        required: true
      responses:
        200:
          $ref: '#/components/responses/AuthorCreated'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        413:
          $ref: '#/components/responses/ContentTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'
        502:
          $ref: '#/components/responses/BadGatewayError'
        503:
          $ref: '#/components/responses/ServiceUnavailableError'
        504:
          $ref: '#/components/responses/GatewayTimeoutError'
components:
  responses:
    BookCreated:
      description: Shows detailed informations of a new author created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookResponse'
    AuthorCreated:
      description: Shows detailed informations of a new author created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorResponse'
    CategoryCreated:
      description: Shows detailed informations of a new category created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CategoryResponse'
    ListAvaiableBooks:
      description: Shows detailed informations of a new category created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListAvaiableBooksResponse'
    BadRequest:
      description: Invalid Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            code: "400.001"
            message: "Constraint validation failed"
            description: "Detailed error description"
    Unauthorized:
      description: |
        The request has not been completed because it lacks valid authentication credentials for the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: Unauthorized
            description: Invalid or expired token
    Forbidden:
      description: |
        The request has not been completed because it lacks valid permissions for the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Forbidden"
            description: "The authentication credentials provided in the request are insufficient to grant access to the resource"
    NotFound:
      description: Shopping cart not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Shopping cart not found"
            description: "Shopping cart not found for provided identifier"
    UnsupportedMediaType:
      description: |
        The server refuses to accept the request because the payload format is in an unsupported format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: Unsupported Media Type
            description: "The payload is in a format not supported by this method on the target resource"
    ContentTooLarge:
      description: |
        The request entity is larger than limits defined by server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Content Too Large"
            description: "The request payload is larger than the server is willing or able to process"
    UnprocessableContent:
      description: |
        The server understands the content type of the request entity, and the syntax of the request entity is correct, but it was unable to process the contained instructions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            code: "422.001"
            message: "Unprocessable Content"
            description: "Detailed error description"
    TooManyRequests:
      description: |
        The consumer has sent too many requests in a given amount of time ("rate limiting").
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Too many requests"
            description: "Too many requests were sent, exceeding the limit that the server can process"
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Internal Server Error"
            description: The server encountered an unexpected condition that prevented it from fulfilling the request.
    BadGatewayError:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Bad gateway"
            description: The server, while acting as a gateway or proxy, received an invalid response from the upstream server.
    ServiceUnavailableError:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Service Unavailable"
            description: The server is not ready to handle the request.
    GatewayTimeoutError:
      description: Gateway Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            message: "Gateway timeout"
            description: The server, while acting as a gateway or proxy, did not get a response in time from the upstream server that it needed in order to complete the request.
  schemas:
    NewBook:
      type: object
      description: Book details entry
      required:
        - title
        - synopsis
        - summary
        - price
        - pages
        - isbn
        - releaseDate
        - category
        - author
      properties:
        title:
          type: string
          description: Book's title
          example: "arry Potter e a Pedra Filosofal"
        synopsis:
          type: string
          description: Book's synopsis
          example: "Harry Potter em uma nova aventura"
          maximum: 500
        summary:
          type: string
          description: Book's summary
          example: |-
            #O novo livro traz diversas aventuras e novo <p>contos</p> especiais.
        price:
          type: number
          minimum: 20.00
          pattern: "^[0-9]+(\\.[0-9]{2})?$"
          example: 39.00
          description: unit price of a book
        pages:
          type: integer
          format: int64
          minimum: 100.00
          example: 150.00
          description: number of a page for a book
        isbn:
          type: string
          description: Book's isbn
          example: "1265456"
        releaseDate:
          type: string
          format: date-time
          description: Release date of a book
          example: '2023-01-01T18:25:43'
        category:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: "199"
              description: category of a book.
            name:
              type: string
              example: "Fantasia"
              description: category's name.
        author:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: "199"
              description: author of a book.
            name:
              type: string
              example: "Paulo"
              description: author's name.
    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
          description: Book's id.
        title:
          type: string
          description: Book's title
          example: "Harry Potter e a Pedra Filosofal"
        synopsis:
          type: string
          description: Book's synopsis
          example: "Harry Potter em uma nova aventura"
        summary:
          type: string
          description: Book's summary
          example: |-
            #O novo livro traz diversas aventuras e novo <p>contos</p> especiais.
        price:
          type: number
          pattern: "^[0-9]+(\\.[0-9]{2})?$"
          example: 39.00
          description: unit price of a book
        pages:
          type: integer
          format: int64
          example: 150.00
          description: number of a page for a book
        isbn:
          type: string
          description: Book's isbn
          example: "1265456"
        releaseDate:
          type: string
          format: date-time
          description: Release date of a book
          example: '2025-01-01T18:25:43'
        category:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: "199"
              description: category of a book.
            name:
              type: string
              example: "Fantasia"
              description: category's name.
        author:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: "199"
              description: author of a book.
            name:
              type: string
              example: "Paulo"
              description: author's name.
    AuthorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: The author's name.
          example: Gustavo
        email:
          type: string
          description: The author's e-mail.
          example: guga@gmail.com
        description:
          type: string
          example: |-
            Gustavo wrotes many books of love and death, spirituality and empathy.
          description: A short description about author
        createdAt:
          type: string
          description: author creation instant
          format: date-time
          example: '2024-12-22T18:03:39'
    NewAuthor:
      type: object
      x-class-extra-annotation: '@cryss.dev.category_api.infraestructure.adapters.validation.constraints.annotations.UniqueFieldName(message="Fild name already in use")'
      required:
        - name
        - email
        - description
      properties:
        name:
          type: string
          description: The author's name.
          example: Gustavo
          x-field-extra-annotation: "@jakarta.validation.constraints.NotEmpty"
        email:
          type: string
          description: The author's e-mail
          format: email
          example: guga@gmail.com
          x-field-extra-annotation: "@cryss.dev.category_api.infraestructure.adapters.validation.constraints.annotations.UniqueEmail"
          minLength: 6  # Optional: minimum length for email
          maxLength: 30  # Optional: maximum length for email
        description:
          type: string
          example: |-
            Gustavo wrotes many books of love and death, spirituality and empathy .
          description: A short description about author
          minLength: 3
          maxLength: 400
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: The author's name.
          example: Informatica
        createdAt:
          type: string
          description: author creation instant
          format: date-time
          example: '2024-12-22T18:03:39'
    ListAvaiableBooksResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AvaiableBooksResponse'
          example:
            - id: 1
              title: "Harry Potter e a Pedra Filosofal"
            - id: 2
              first_name: "Harry Potter e a Ordem da Fenix"
    AvaiableBooksResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
          description: Book's id.
        title:
          type: string
          description: Book's title
          example: "Harry Potter e a Pedra Filosofal"
    NewCategory:
      type: object
      x-class-extra-annotation: '@cryss.dev.category_api.infraestructure.adapters.validation.constraints.annotations.UniqueFieldName(message="Fild name already in use")'
      required:
        - name
      properties:
        name:
          type: string
          description: The category name.
          example: Informatica
          x-field-extra-annotation: "@jakarta.validation.constraints.NotEmpty"
    InternalError:
      description: Entity representing error information that occurred in the backend.
      type: object
      required:
        - message
        - description
      properties:
        code:
          type: string
          example: "400.001"
          description: Error code
        message:
          type: string
          example: Here is a summarized error message
          description: Error message
        description:
          type: string
          example: Here is some detailed error message
          description: Detailed error message